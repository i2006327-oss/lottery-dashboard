<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="color-scheme" content="light dark">
<title>台灣彩券研究總覽</title>
<style>
:root{color-scheme:light dark;--bg:#f4f6fb;--card:#fff;--ink:#182238;--muted:#63708a;--line:#dce2ed;--accent:#3859c7;--ball:#eef2ff;--hit:#d83457}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 system-ui,"Noto Sans TC",sans-serif}header,main,footer{width:min(1180px,100%);margin:auto;padding:20px}header{display:flex;justify-content:space-between;align-items:center;gap:16px}h1{font-size:clamp(1.4rem,4vw,2.2rem);margin:0}button{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;padding:9px 14px;cursor:pointer}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));align-items:start;gap:16px}.card{min-width:0;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:20px;box-shadow:0 6px 24px #1a2a4510}.card h2{margin:0 0 8px}.muted{color:var(--muted);font-size:.92rem}.section{border-top:1px solid var(--line);padding-top:12px;margin-top:14px}.balls{display:flex;flex-wrap:wrap;gap:7px;margin:8px 0}.ball{display:inline-grid;place-items:center;min-width:36px;height:36px;padding:0 8px;border-radius:50%;background:var(--ball);font-weight:700}.ball.hit{background:var(--hit);color:white}.ball.special{background:#f5c542;color:#3b2c00;border:2px solid #d59600}.ball.special{background:#f5c542;color:#3b2c00;border:2px solid #d59600}.track{margin:8px 0}.recent{display:grid;gap:6px}.recent-row{display:grid;grid-template-columns:82px minmax(0,1fr);gap:8px;border-bottom:1px dashed var(--line);padding:5px 0}.recent-value{overflow-wrap:anywhere}.status{display:inline-block;border-radius:99px;padding:2px 9px;background:var(--ball);color:var(--accent)}.metric-table{width:100%;border-collapse:collapse;font-size:.88rem}.metric-table th,.metric-table td{padding:7px 6px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}.metric-table th:first-child,.metric-table td:first-child{text-align:left}.table-wrap{overflow-x:auto}.metric-table caption{text-align:left;padding:5px;font-weight:700}footer{color:var(--muted);font-size:.9rem}body[data-theme=dark]{--bg:#101522;--card:#1a2232;--ink:#edf1fa;--muted:#a5b0c5;--line:#303b50;--accent:#aabaff;--ball:#2c3855}
@media(max-width:700px){header,main,footer{padding:14px}.grid{grid-template-columns:minmax(0,1fr)}.card{padding:16px}.recent-row{grid-template-columns:72px minmax(0,1fr);font-size:.84rem}.metric-table{font-size:.78rem}.metric-table th,.metric-table td{padding:6px 4px}}
</style></head><body><header><div><h1>台灣彩券研究總覽</h1><div id="built" class="muted">載入資料中…</div></div><button id="theme" type="button">切換深淺色</button></header><main><div id="games" class="grid"></div></main><footer>研究用途，不保證中獎；購買狀態未確認。指標為歷史重播研究，請查看各自資料截止日。</footer>
<script>
const el=(tag,cls,text)=>{const n=document.createElement(tag);if(cls)n.className=cls;if(text!==undefined)n.textContent=text;return n};
function balls(parent,nums,hit=[]){const row=el('div','balls');(nums||[]).forEach(n=>row.append(el('span','ball'+(hit.includes(n)?' hit':''),String(n).padStart(2,'0'))));parent.append(row)}
function ticketBalls(parent,ticket,label){if(Array.isArray(ticket)){balls(parent,ticket);return}balls(parent,ticket.main||[]);if(ticket.special?.length){parent.append(el('small','muted',label||'\u7279\u5225\u865f'));const row=el('div','balls');ticket.special.forEach(n=>row.append(el('span','ball special',String(n).padStart(2,'0'))));parent.append(row)}}
const pct=x=>x==null?'—':(x*100).toFixed(1)+'%';
function metricTable(metrics){const wrap=el('div','table-wrap');const table=el('table','metric-table');table.append(el('caption','', '重播研究指標（截止 '+(metrics.cutoff||'無')+'）'));const head=el('thead');const hr=el('tr');['指標','W30','W300','W1000','隨機基準'].forEach(x=>hr.append(el('th','',x)));head.append(hr);table.append(head);const body=el('tbody');const rows=[['ANY',v=>pct(v?.any),v=>pct(v?.any)],['3+ 次數',v=>String(v?.count3??'—'),v=>pct(v?.hit3)],['4+ 次數',v=>String(v?.count4??'—'),v=>pct(v?.hit4)],['毛 ROI',v=>pct(v?.gross_roi),v=>pct(v?.gross_roi)],['淨 ROI',v=>pct(v?.net_roi),()=> '—'],['不含 4+ 毛 ROI',v=>pct(v?.gross_roi_ex4plus),v=>pct(v?.gross_roi_ex4plus)],['max0',v=>String(v?.max0??'—'),()=> '—']];for(const [label,windowValue,baselineValue] of rows){const tr=el('tr');tr.append(el('th','',label));for(const key of ['W30','W300','W1000'])tr.append(el('td','',windowValue(metrics.windows?.[key])));tr.append(el('td','',baselineValue(metrics.random_baseline)));body.append(tr)}table.append(body);wrap.append(table);return wrap}
function renderGame(g){const card=el('article','card');card.append(el('h2','',g.game_name));card.append(el('span','status',g.status==='not_connected'?'尚未接入':g.status==='stale'?'資料過期':'研究資料'));if(g.status==='not_connected'){card.append(el('p','muted','此彩種尚未接入資料來源。'));return card}
const next=el('section','section');next.append(el('strong','','下一期 '+(g.next_draw?.date||'尚無推薦')));if(g.next_draw){next.append(el('p','muted',g.next_draw.sealed?'已封存':'未封存；購買狀態未確認'));g.next_draw.tracks.forEach(t=>{next.append(el('div','track',t.name+'（'+t.role+'）'));t.tickets.forEach(ticket=>ticketBalls(next,ticket,g.special_label));})}else next.append(el('p','muted','目前沒有晚於資料截止期的推薦。'));card.append(next);
if(g.latest_draw){const s=el('section','section');s.append(el('strong','','最新開獎 '+g.latest_draw.date));balls(s,g.latest_draw.numbers);if(g.latest_draw.special!=null){s.append(el('small','muted',g.special_label||'\u7279\u5225\u865f'));const sr=el('div','balls');sr.append(el('span','ball special',String(g.latest_draw.special).padStart(2,'0')));s.append(sr);}g.latest_draw.settlements.forEach(x=>s.append(el('p','',x.track+'命中 '+x.hits.join('+')+' 個，回收 '+x.payout+' 元')));if(!g.latest_draw.settlements.length)s.append(el('p','muted','未核對'));card.append(s)}
const r=el('section','section');r.append(el('strong','','近 10 期回收'));const list=el('div','recent');g.recent.forEach(d=>{const row=el('div','recent-row');row.append(el('span','',d.date));const value=el('span','recent-value',d.settlements.length?d.settlements.map(x=>(x.role==='formal'?'正式':'觀察')+' '+(x.hits.length?x.hits.join('+'):'未核對')+' '+x.payout+'元').join('｜'):'未核對');row.append(value);list.append(row)});r.append(list);card.append(r);
const m=el('section','section');m.append(el('strong','','指標與隨機基準'));m.append(el('p','muted',g.metrics.note+'；隨機基準：兩組互斥票。'));m.append(metricTable(g.metrics));card.append(m);card.append(el('p','muted','研究用途，不保證中獎；購買狀態未確認。資料截止：'+g.data_cutoff+'｜管線：'+(g.pipeline.stage||'未知')+' / '+g.pipeline.status));return card}
async function start(){try{const res=await fetch('data/feed.json');if(!res.ok)throw new Error('資料載入失敗');const feed=await res.json();document.getElementById('built').textContent='最後建置：'+feed.generated_at;const root=document.getElementById('games');feed.games.forEach(g=>root.append(renderGame(g)))}catch(e){document.getElementById('built').textContent='資料尚未載入，請確認 feed.json 已建置。'}}
document.getElementById('theme').addEventListener('click',()=>{const dark=document.body.dataset.theme!=='dark';document.body.dataset.theme=dark?'dark':'light'});start();
</script></body></html>
