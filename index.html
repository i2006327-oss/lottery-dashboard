<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="color-scheme" content="light dark">
<title>台灣彩券研究總覽</title>
<style>
:root{color-scheme:light dark;--bg:#f4f6fb;--card:#fff;--ink:#182238;--muted:#63708a;--line:#dce2ed;--accent:#3859c7;--ball:#eef2ff;--hit:#d83457}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 system-ui,"Noto Sans TC",sans-serif}header,main,footer{width:min(1180px,100%);margin:auto;padding:20px}header{display:flex;justify-content:space-between;align-items:center;gap:16px}h1{font-size:clamp(1.4rem,4vw,2.2rem);margin:0}button{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;padding:9px 14px;cursor:pointer}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));align-items:start;gap:16px}.card{min-width:0;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:20px;box-shadow:0 6px 24px #1a2a4510}.card h2{margin:0 0 8px}.overdue{color:var(--hit)}.muted{color:var(--muted);font-size:.92rem}.section{border-top:1px solid var(--line);padding-top:12px;margin-top:14px}.balls{display:flex;flex-wrap:wrap;gap:7px;margin:8px 0}.ball{display:inline-grid;place-items:center;min-width:36px;height:36px;padding:0 8px;border-radius:50%;background:var(--ball);font-weight:700}.ball.hit{background:var(--hit);color:white}.ball.special{background:#f5c542;color:#3b2c00;border:2px solid #d59600}.ball.special{background:#f5c542;color:#3b2c00;border:2px solid #d59600}.track{margin:8px 0}.pair-pills{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}.pair-pill{display:inline-block;padding:3px 9px;border-radius:999px;background:var(--ball);font-weight:700}.recent{display:grid;gap:6px}.recent-row{display:grid;grid-template-columns:82px minmax(0,1fr);gap:8px;border-bottom:1px dashed var(--line);padding:5px 0}.recent-value{overflow-wrap:anywhere}.status{display:inline-block;border-radius:99px;padding:2px 9px;background:var(--ball);color:var(--accent)}.metric-table{width:100%;border-collapse:collapse;font-size:.88rem}.metric-table th,.metric-table td{padding:7px 6px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}.metric-table th:first-child,.metric-table td:first-child{text-align:left}.table-wrap{overflow-x:auto}.metric-table caption{text-align:left;padding:5px;font-weight:700}footer{color:var(--muted);font-size:.9rem}body[data-theme=dark]{--bg:#101522;--card:#1a2232;--ink:#edf1fa;--muted:#a5b0c5;--line:#303b50;--accent:#aabaff;--ball:#2c3855}
@media(max-width:700px){header,main,footer{padding:14px}.grid{grid-template-columns:minmax(0,1fr)}.card{padding:16px}.recent-row{grid-template-columns:72px minmax(0,1fr);font-size:.84rem}.metric-table{font-size:.78rem}.metric-table th,.metric-table td{padding:6px 4px}}
.cash-warning{margin:0 auto 12px;width:min(1140px,calc(100% - 28px));padding:12px;border:2px solid #b91c1c;border-radius:10px;background:#fee2e2;color:#991b1b;overflow-wrap:anywhere}.cash-promo{background:#fff3bf;color:#664d03;border:1px solid #e4bd36;border-radius:10px;padding:12px;overflow-wrap:anywhere}.cash-plan{overflow-wrap:anywhere}.cash-plan .overdue{font-weight:700}.cash-summary{display:grid;gap:8px}.cash-summary p{margin:4px 0}
</style></head><body><header><div><h1>台灣彩券研究總覽</h1><div id="built" class="muted">載入資料中…</div></div><button id="theme" type="button">切換深淺色</button></header><main><div id="games" class="grid"></div></main><footer>研究用途，不保證中獎；購買狀態未確認。指標為歷史重播研究，請查看各自資料截止日。</footer>
<script>
const el=(tag,cls,text)=>{const n=document.createElement(tag);if(cls)n.className=cls;if(text!==undefined)n.textContent=text;return n};
function settlementText(d){return d.settlement_status==='no_record'?'無開獎前凍結紀錄':d.settlement_status==='pending'?'待開獎核對':'未核對'}
function balls(parent,nums,hit=[]){const row=el('div','balls');(nums||[]).forEach(n=>row.append(el('span','ball'+(hit.includes(n)?' hit':''),String(n).padStart(2,'0'))));parent.append(row)}
function ticketBalls(parent,ticket,label){if(Array.isArray(ticket)){balls(parent,ticket);return}balls(parent,ticket.main||[]);if(ticket.special?.length){parent.append(el('small','muted',label||'\u7279\u5225\u865f'));const row=el('div','balls');ticket.special.forEach(n=>row.append(el('span','ball special',String(n).padStart(2,'0'))));parent.append(row)}}
const pct=x=>x==null?'—':(x*100).toFixed(1)+'%';
function metricTable(metrics){const wrap=el('div','table-wrap');const table=el('table','metric-table');table.append(el('caption','', '重播研究指標（截止 '+(metrics.cutoff||'無')+'）'));const head=el('thead');const hr=el('tr');['指標','W30','W300','W1000','隨機基準'].forEach(x=>hr.append(el('th','',x)));head.append(hr);table.append(head);const body=el('tbody');const rows=[['ANY',v=>pct(v?.any),v=>pct(v?.any)],['3+ 次數',v=>String(v?.count3==null?'—':v.count3),v=>pct(v?.hit3)],['4+ 次數',v=>String(v?.count4==null?'—':v.count4),v=>pct(v?.hit4)],['毛 ROI',v=>pct(v?.gross_roi),v=>pct(v?.gross_roi)],['淨 ROI',v=>pct(v?.net_roi),()=> '—'],['不含 4+ 毛 ROI',v=>pct(v?.gross_roi_ex4plus),v=>pct(v?.gross_roi_ex4plus)],['max0',v=>String(v?.max0==null?'—':v.max0),()=> '—']];for(const [label,windowValue,baselineValue] of rows){const tr=el('tr');tr.append(el('th','',label));for(const key of ['W30','W300','W1000'])tr.append(el('td','',windowValue(metrics.windows?.[key])));tr.append(el('td','',baselineValue(metrics.random_baseline)));body.append(tr)}table.append(body);wrap.append(table);return wrap}
function nextDate(value,weekday=false){if(!value)return '';const date=new Date(value.slice(0,4)+'-'+value.slice(4,6)+'-'+value.slice(6,8)+'T00:00:00+08:00');const label=Number(value.slice(4,6))+'/'+Number(value.slice(6,8));return label+(weekday?'（'+new Intl.DateTimeFormat('zh-TW',{weekday:'short',timeZone:'Asia/Taipei'}).format(date)+'）':'')}
function cashPackages(n){const done=[],missing=[],tracks=n.tracks||[];if(tracks.some(t=>t.role==='observe'))done.push('高ANY');if(n.sealed&&tracks.some(t=>t.role==='formal'))done.push('正式');else missing.push('正式');const lehe=tracks.find(t=>t.role==='lehe_2he');if(lehe){if(lehe.status==='missing')missing.push('二合');else done.push('二合')}return {done,missing}}
const cashNames={formal:'正式組',high_any:'高ANY',lehe_2he:'二合'};
const cashAlertText={pipeline_failed:'539 管線最後一次執行失敗',recommendation_overdue:'539 推薦逾期',stop_loss:'539 本月已達停損，暫停購買',reconciliation_overdue:'539 開獎已超過 2 個開獎日仍未核對',purchase_unavailable:'539 購買計畫資料缺漏或無法核驗',actual_unavailable:'539 實際帳本資料缺漏或無法核驗'};
const cashAmount=x=>Number(x).toLocaleString('zh-TW',{maximumFractionDigits:2});
function cashPayout(x){return x.net_payout==null?'回收 '+cashAmount(x.payout)+' 元（稅後實得尚未核驗）':'稅後實得 '+cashAmount(x.net_payout)+' 元'}
function renderCashNext(g){
const s=el('section','section cash-plan'),n=g.next_draw,p=g.purchase;
s.append(el('strong','','下一期 '+p.date));
if(n?.state==='overdue')s.append(el('p','overdue','推薦逾期'));
else if(n?.state!=='ready')s.append(el('p','muted','推薦'+(n?.state==='generating'?'產生中':'預計 '+(n?.expected_at||'待確認')+' 產生')));
const description=p.tracks.map(t=>t.name+' '+t.count+' 注 '+cashAmount(t.amount)+' 元').join('、');
if(p.status==='pending')s.append(el('p','muted','購買計畫待開獎日產生（預定：'+description+'）'));
else if(p.status==='buy')s.append(el('p','','本期購買：'+description));
else if(p.status==='stop_loss_paused')s.append(el('p','overdue','本月已達停損，暫停購買；當月損益 '+cashAmount(p.monthly_profit)+' 元；停損上限 '+cashAmount(p.loss_limit)+' 元'));
else s.append(el('p','muted','購買計畫資料缺漏或無法核驗'));
if(p.paper_only.length)s.append(el('p','muted',p.paper_only.map(t=>cashNames[t]).join('、')+'：紙上紀錄（不購買）'));
for(const t of n?.tracks||[]){
const track=t.role==='observe'?'high_any':t.role;
s.append(el('div','track',t.name+(p.paper_only.includes(track)?'｜紙上紀錄（不購買）':'')+'｜'+t.tickets.length+' 注・'+cashAmount(t.cost)+' 元'));
if(t.status==='missing'){s.append(el('p','muted','推薦資料缺漏'));continue}
if(t.role==='lehe_2he'){const row=el('div','pair-pills');t.tickets.forEach(pair=>row.append(el('span','pair-pill',pair.map(v=>String(v).padStart(2,'0')).join('・'))));s.append(row)}
else t.tickets.forEach(ticket=>ticketBalls(s,ticket,g.special_label));
}
return s}
function renderCashActual(g){
const s=el('section','section cash-summary'),a=g.actual_pnl;s.append(el('strong','','實際購買損益'));
if(!a||a.status!=='ok'){s.append(el('p','muted','實際帳本資料缺漏或無法核驗；不以紙上紀錄替代'));return s}
for(const [label,x] of [['本月（'+a.month+'）',a.monthly],['累計',a.all_time]]){s.append(el('p','',label+'｜'+x.periods+' 期｜成本 '+cashAmount(x.cost)+' 元｜稅後回收 '+cashAmount(x.net_return)+' 元｜損益 '+cashAmount(x.profit)+' 元'));if(x.pending_periods)s.append(el('p','muted','其中 '+x.pending_periods+' 期待核對，成本 '+cashAmount(x.pending_cost)+' 元已計入；未核對回收暫計 0 元'))}
s.append(el('p','muted','僅彙總實際帳本；單注超過 5,000 元按來源規則扣稅後計入。截止 '+g.data_cutoff));return s}
function renderCashPromos(g){
const s=el('section','section'),p=g.promotions;s.append(el('strong','','加碼提示'));
if(!p||p.status!=='ok'){s.append(el('p','muted',p?.status==='stale'?'活動資料過期，待重新確認':'活動資料無法取得，尚未確認進行中活動'));return s}
if(!p.activities.length)s.append(el('p','muted','目前無已確認且回收率高於一般期間的活動'));
for(const a of p.activities){const box=el('div','cash-promo');box.append(el('strong','',a.name));box.append(el('p','',a.start_date+'～'+a.end_date+'｜加碼後期望回收率 '+pct(a.promo_roi)+'（一般 '+pct(a.normal_roi)+'）；指標截止 '+p.cutoff));const link=el('a','','官方活動公告');link.href=a.official_url;link.target='_blank';link.rel='noopener noreferrer';box.append(link);box.append(el('p','','建議，需人工決定'));s.append(box)}
return s}
function renderCashGame(g){
const card=el('article','card');card.append(el('h2','',g.game_name));card.append(el('span','status',g.status==='stale'?'資料過期':'研究資料'));card.append(renderCashNext(g),renderCashActual(g),renderCashPromos(g));
if(g.latest_draw){const s=el('section','section');s.append(el('strong','','最新開獎 '+g.latest_draw.date+'｜紙上紀錄'));balls(s,g.latest_draw.numbers);g.latest_draw.settlements.forEach(x=>s.append(el('p','',x.track+'｜命中 '+x.hits.join('+')+' 個，'+cashPayout(x))));if(!g.latest_draw.settlements.length)s.append(el('p','muted','待開獎核對'));card.append(s)}
const r=el('section','section');r.append(el('strong','','近 10 期紙上紀錄'));const list=el('div','recent');
g.recent.forEach(d=>{const row=el('div','recent-row');row.append(el('span','',d.date));row.append(el('span','recent-value',d.settlements.length?d.settlements.map(x=>x.track+' '+cashPayout(x)).join('｜'):'待開獎核對'));list.append(row)});r.append(list);card.append(r);
const m=el('section','section');m.append(el('strong','','指標與隨機基準'));m.append(el('p','muted',g.metrics.note));m.append(metricTable(g.metrics));card.append(m);card.append(el('p','muted','研究用途，不保證中獎；購買狀態未確認。資料截止：'+g.data_cutoff+'｜管線：'+(g.pipeline.stage||'未知')+' / '+g.pipeline.status));return card}
function renderCashWarnings(games){
document.getElementById('cash-alerts')?.remove();
const texts=games.filter(g=>g.game_id==='cash539').flatMap(g=>(g.alerts||[]).map(a=>cashAlertText[a]).filter(Boolean));
if(!texts.length)return;const banner=el('div','cash-warning');banner.id='cash-alerts';banner.setAttribute('role','alert');texts.forEach(t=>banner.append(el('div','',t)));document.querySelector('header').after(banner)}
function renderNext(g){
const next=el('section','section'),n=g.next_draw;
if(n?.state==='ready'){const heading=el('div','next-heading');heading.append(el('strong','','\u4e0b\u4e00\u671f '+n.date));if(n.total_cost!=null)heading.append(el('span','muted','\u672c\u671f\u5408\u8a08 '+n.total_cost+' \u5143'));next.append(heading);next.append(el('p','muted',n.sealed?'\u5df2\u5c01\u5b58':'\u672a\u5c01\u5b58\uff1b\u8cfc\u8cb7\u72c0\u614b\u672a\u78ba\u8a8d'));n.tracks.forEach(t=>{if(t.role==='lehe_2he'){next.append(el('div','track','\u6a02\u5408\u4e8c\u5408 8 \u6ce8\u30fb200 \u5143'));if(t.status==='missing'){next.append(el('p','muted','\u4e8c\u5408\u63a8\u85a6\u8cc7\u6599\u7f3a\u6f0f'));return}const row=el('div','pair-pills');t.tickets.forEach(pair=>row.append(el('span','pair-pill',pair.map(v=>String(v).padStart(2,'0')).join('\u30fb'))));next.append(row);return}next.append(el('div','track',t.name+'\uff08'+t.role+'\uff09'));t.tickets.forEach(ticket=>ticketBalls(next,ticket,g.special_label));})}
else if(n?.state==='scheduled'){next.append(el('strong','muted','\u4e0b\u4e00\u671f '+nextDate(n.date,true)+'\uff1b\u63a8\u85a6\u9810\u8a08 '+n.expected_at.slice(9)+' \u7522\u751f'))}
else if(n?.state==='generating'&&g.game_id==='cash539'){const packs=cashPackages(n);next.append(el('strong','muted','推薦產生中（已完成：'+(packs.done.join('、')||'無')+'）'))}
else if(n?.state==='overdue'&&g.game_id==='cash539'){const packs=cashPackages(n);next.append(el('strong','overdue','下一期 '+nextDate(n.date)+'；推薦逾期（缺少：'+packs.missing.join('、')+'）'))}
else if(n?.state==='overdue'){next.append(el('strong','overdue','\u4e0b\u4e00\u671f '+nextDate(n.date)+'\uff1b\u63a8\u85a6\u903e\u671f\u672a\u7522\u751f'))}
else next.append(el('strong','muted','\u4e0b\u4e00\u671f\u8cc7\u6599\u5c1a\u672a\u63d0\u4f9b'));
return next}
function renderGame(g){if(g.game_id==='cash539'&&g.purchase)return renderCashGame(g);const card=el('article','card');card.append(el('h2','',g.game_name));card.append(el('span','status',g.status==='not_connected'?'尚未接入':g.status==='stale'?'資料過期':'研究資料'));if(g.status==='not_connected'){card.append(el('p','muted','此彩種尚未接入資料來源。'));return card}
card.append(renderNext(g));
if(g.latest_draw){const s=el('section','section');s.append(el('strong','','最新開獎 '+g.latest_draw.date));balls(s,g.latest_draw.numbers);if(g.latest_draw.special!=null){s.append(el('small','muted',g.special_label||'\u7279\u5225\u865f'));const sr=el('div','balls');sr.append(el('span','ball special',String(g.latest_draw.special).padStart(2,'0')));s.append(sr);}g.latest_draw.settlements.forEach(x=>s.append(el('p','',x.track+(x.prizes?' '+x.prizes.join('｜'):'命中 '+x.hits.join('+')+' 個')+'，回收 '+x.payout+' 元')));if(!g.latest_draw.settlements.length)s.append(el('p','muted',settlementText(g.latest_draw)));card.append(s)}
const r=el('section','section');r.append(el('strong','','近 10 期回收'));const list=el('div','recent');g.recent.forEach(d=>{const row=el('div','recent-row');row.append(el('span','',d.date));const value=el('span','recent-value',d.settlements.length?d.settlements.map(x=>(x.prizes?x.track+' '+x.prizes.join('｜'):(x.role==='formal'?'正式':'觀察')+' '+(x.hits.length?x.hits.join('+'):'未核對'))+' '+x.payout+'元').join('｜'):settlementText(d));row.append(value);list.append(row)});r.append(list);card.append(r);
const m=el('section','section');m.append(el('strong','','指標與隨機基準'));m.append(el('p','muted',g.metrics.note+(g.metrics.note.includes('隨機基準')?'':'；隨機基準：兩組互斥票。')));m.append(metricTable(g.metrics));card.append(m);card.append(el('p','muted','研究用途，不保證中獎；購買狀態未確認。資料截止：'+g.data_cutoff+'｜管線：'+(g.pipeline.stage||'未知')+' / '+g.pipeline.status));return card}
async function start(){try{const res=await fetch('data/feed.json?v='+Date.now(),{cache:'no-store'});if(!res.ok)throw new Error('資料載入失敗');const feed=await res.json();document.getElementById('built').textContent='最後建置：'+feed.generated_at;const root=document.getElementById('games');feed.games.forEach(g=>root.append(renderGame(g)));renderCashWarnings(feed.games)}catch(e){document.getElementById('built').textContent='資料尚未載入，請確認 feed.json 已建置。'}}
document.getElementById('theme').addEventListener('click',()=>{const dark=document.body.dataset.theme!=='dark';document.body.dataset.theme=dark?'dark':'light'});start();
</script></body></html>
